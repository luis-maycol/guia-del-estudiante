  <body>
    <script>
      // Restaura la ruta que dejó 404.html (GitHub Pages)
      (function (l) {
        if (l.search[1] === "/") {
          var d = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
